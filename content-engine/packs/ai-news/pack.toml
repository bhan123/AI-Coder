# AI 资讯 content pack
#
# 这是从原 ai_content_loop 项目抽取出来的现役配置。做新点子时，把整个目录
# 复制一份改名，然后改这四个 TOML 和 prompts/ 下的三个提示词即可。

name = "ai-news"
description = "面向泛读者的 AI 工具、开源项目与趋势解读"

default_column = "AI 神器发现"

# ---------------------------------------------------------------------------
# 栏目
#
# 路由顺序即数组顺序：第一个命中 match_sources 或 match_keywords 的栏目胜出，
# 都不命中则落到 default_column。LLM 在打分阶段给出的 column 优先级最高。
# guide 会原样嵌进写作简报，是控制单个栏目调性的主要抓手。
# ---------------------------------------------------------------------------

[[columns]]
name = "普通人也看得懂的 AI 趋势"
match_sources = ["arxiv"]
match_keywords = ["paper", "论文", "研究"]
guide = """- 核心问题："这跟我有什么关系？"
- 必答：为什么发生？对普通人意味着什么？3 个月后会怎样？
- 不高谈阔论，不写技术原理，写影响和变化
- 语气：趋势解释者，"这件事值得关注因为..." """

[[columns]]
name = "开源项目淘金"
match_sources = ["github"]
match_keywords = []
guide = """- 核心问题："为什么这个项目值得关注？"
- 必答：解决了什么痛点？比现有方案好在哪？部署难度如何？
- 不要只写技术参数，写"这个项目如果做成产品会是什么样"
- 语气：技术买手，"这个项目值得关注因为..." """

[[columns]]
name = "AI 副业/生意灵感"
match_sources = []
match_keywords = [
  "business", "sales", "customer", "startup",
  "营销", "获客", "副业", "赚钱", "变现", "产品",
]
guide = """- 核心问题："这个模式我能复制吗？"
- 必答：目标用户是谁？怎么赚钱？投入多少？风险在哪？
- 必须有风险提示，不能画饼
- 语气：务实分析，"如果你有 X 技能，可以考虑 Y，但注意 Z" """

[[columns]]
name = "AI 神器发现"
match_sources = []
match_keywords = []
guide = """- 核心问题："这个工具能帮我做什么？"
- 必答：免费吗？上手门槛多高？比现在用的好在哪？
- 找最吸引人的一个功能深入写，不要列功能清单
- 语气：朋友安利好物，"你可以试试这个" """

# ---------------------------------------------------------------------------
# 写作简报
# ---------------------------------------------------------------------------

[brief]
task = "写一篇好懂、有趣、重点前置的 AI 内容，让泛读者先看懂，再让高频受益人群看到用法。"
checklist = [
  "前 100 字给出结果、反差、边界或工作流变化，并接住标题。",
  "用人话解释它是什么；参数只作为证据，不作为开头。",
  "选择 1-2 个证据最充分的场景写透，不凑功能清单。",
  "回答一个核心价值：提效、商业可能、学习或情绪价值。",
  "给出基于证据的作者判断，并说明事实边界。",
  "写清具体限制和一个可执行的下一步。",
  "保留来源链接。",
]

# ---------------------------------------------------------------------------
# 选题配比
#
# 每批入队时：先塞一条 practical 来源保底，research 来源最多 N 条，
# 避免整批都是论文或都是同一类源。
# ---------------------------------------------------------------------------

[balance]
research_sources = ["arxiv", "modelscope", "huggingface"]
practical_sources = ["producthunt", "huggingface_spaces"]
practical_prefixes = ["rss_sspai", "rss_appinn", "rss_ifanr", "rss_zapier"]
max_research_per_batch = 1

# ---------------------------------------------------------------------------
# 各平台正文骨架
#
# 可用占位符：{title} {column} {url} {source} {min_chars}
# 未知占位符会原样保留，写错了会在正文里看见，而不是静默出错。
# ---------------------------------------------------------------------------

[platform_min_chars]
wechat = 600
xiaohongshu = 600
toutiao = 600
zhihu = 600

[platform_skeletons]
wechat = """# {title}

栏目：{column}

不少于 {min_chars} 字，不设上限；只讲两个证据最充分的场景，写清流程、变化、限制，保留来源链接：{url}

覆盖要素：标题承接、核心判断、具体场景、差异、限制和下一步；顺序自定，不使用固定场景编号。"""

xiaohongshu = """# {title}

栏目：{column}

不少于 {min_chars} 字，不设上限；拆成 4-6 张卡片，第一屏直接讲结果和反差。
Emoji 点缀但不过度。不要写微信号、二维码、外链描述。

覆盖亮点、用法、证据和注意事项；顺序自定，避免固定卡片话术。"""

toutiao = """# {title}

栏目：{column}

不少于 {min_chars} 字，不设上限；标题直接，信息密度高，少玩梗。
前 50 字决定推荐量，必须最吸引人。

覆盖核心价值、场景、数据证据和观点；顺序自定，保持信息密度。"""

zhihu = """# {title}

栏目：{column}

不少于 {min_chars} 字，不设上限；用问答口吻解释为什么值得关注。
允许适度的个人观点和判断（标注是个人观点）。

覆盖问题、证据、重要性、用法或判断；顺序自定，论证完整。"""
