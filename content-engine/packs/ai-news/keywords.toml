# 关键词预筛配置
#
# 预筛是廉价的第一道闸：它把上百条原始条目排序，只让前 N 条进入昂贵的 LLM
# 精选。这里的词表不需要精确，只需要能把明显相关的推到前面。

# ---------------------------------------------------------------------------
# 打分维度
#
# 每个维度 = base 分 + 命中词数，上限 10。cn 按原文匹配，en 转小写匹配。
# 维度名要和下面 [weights] 对得上。
#
# 注意：engine 的存储表固定有 clarity/fun/usefulness/demo 四列，用这四个名字
# 的维度会原样落库；用别的名字也能跑，但落库时取默认值 5。
# ---------------------------------------------------------------------------

[groups.clarity]
base = 5
cn = ["工具", "demo", "演示", "app", "应用", "平台",
      "一键", "自动", "免费", "开源", "在线",
      "小白", "新手", "普通人", "零基础"]
en = ["tool", "demo", "app", "workflow", "assistant", "bot", "generator", "automation"]

[groups.fun]
base = 4
cn = ["有趣", "好玩", "神器", "创意", "生成",
      "聊天", "对话", "游戏", "视频", "图片",
      "声音", "音乐", "动画", "表情", "头像"]
en = ["fun", "interesting", "creative", "image", "video",
      "voice", "agent", "game", "chat", "screenshot", "generate"]

[groups.usefulness]
base = 5
cn = ["提效", "效率", "省时", "自动化", "降本",
      "副业", "赚钱", "变现", "获客", "内容",
      "写作", "办公", "营销", "学习", "翻译",
      "总结", "整理", "搜索", "分析"]
en = ["automate", "save", "summarize", "write", "customer",
      "content", "sales", "work", "productivity"]

[groups.demo]
base = 4
cn = ["截图", "演示", "demo", "案例", "示例",
      "教程", "上手", "体验", "试用"]
en = ["demo", "screenshot", "space", "example", "preview", "ui", "app", "generate"]

# ---------------------------------------------------------------------------
# 维度权重（必须加总为 1.0）
#
# novelty / heat / credibility 是引擎内建维度，不用配词表。
# ---------------------------------------------------------------------------

[weights]
novelty = 0.20
clarity = 0.20
fun = 0.20
usefulness = 0.20
demo = 0.10
heat = 0.05
credibility = 0.05

# ---------------------------------------------------------------------------
# 标题党惩罚：命中一个扣 penalty_per_hit 分，最多扣 penalty_max 分
# ---------------------------------------------------------------------------

[clickbait]
words = ["震惊", "疯了", "炸裂", "颠覆", "彻底改变", "革命性", "人人都能"]
penalty_per_hit = 2
penalty_max = 6

# ---------------------------------------------------------------------------
# 时效衰减
#
# tiers 按天数升序，第一个满足 age <= 天数 的档位胜出；都不满足取最后一档。
# ---------------------------------------------------------------------------

[recency]
tiers = [[7, 1.0], [14, 0.7], [36500, 0.5]]
novelty_base_dated = 7
novelty_base_undated = 5

# ---------------------------------------------------------------------------
# 来源可信度（1-10）
# ---------------------------------------------------------------------------

[credibility]
default = 5
prefixes = [["official_rss", 8]]

[credibility.sources]
arxiv = 10
github = 8
hackernews = 7
modelscope = 7
producthunt = 6

# ---------------------------------------------------------------------------
# 热度归一化
#
# 把各来源口径不同的原始指标（star / 分数 / 投票）压到统一的 1-10。
# thresholds 必须按数值降序，第一个 >= 的档位胜出，都不满足取 floor。
# weights 与 fields 等长，用于把多个指标合成一个数（如下载量 + 星标×100）。
# ---------------------------------------------------------------------------

[heat]
default = 5
prefixes = [["official_rss", 7]]

[heat.sources.github]
fields = ["stars"]
weights = [1]
thresholds = [[5000, 10], [1000, 9], [500, 8], [100, 6], [50, 4]]
floor = 2

[heat.sources.hackernews]
fields = ["score"]
weights = [1]
thresholds = [[500, 10], [200, 9], [100, 7], [50, 5], [20, 3]]
floor = 1

[heat.sources.producthunt]
fields = ["votes"]
weights = [1]
thresholds = [[1000, 10], [500, 8], [200, 6], [100, 4], [50, 3]]
floor = 1

[heat.sources.modelscope]
fields = ["downloads", "stars"]
weights = [1, 100]
thresholds = [
  [500000, 10], [100000, 9], [50000, 8],
  [10000, 6], [5000, 4], [1000, 2],
]
floor = 1
