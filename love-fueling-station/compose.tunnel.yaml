services:
  web:
    build:
      context: .
      dockerfile: Dockerfile.tunnel
    depends_on:
      api:
        condition: service_started
    ports:
      - "127.0.0.1:8088:80"
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: server/Dockerfile
    environment:
      APP_DATABASE_PATH: /app/data/love-fueling-station.sqlite
      APP_ORIGIN: ${APP_ORIGIN:-https://temporary.invalid}
      PORT: "8787"
      COOKIE_SECURE: "true"
      SESSION_SECRET: ${SESSION_SECRET:?SESSION_SECRET is required}
    restart: unless-stopped
    volumes:
      - station_data:/app/data

  tunnel:
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate --url http://web:80
    depends_on:
      web:
        condition: service_started
    restart: unless-stopped

volumes:
  station_data:
